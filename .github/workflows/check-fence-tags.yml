name: Check fence tags

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-fence-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Test the checker
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      # Every fenced json/yaml block must carry a tag from CONTRIBUTING.md, and
      # blocks tagged as mirrord or mirrord-up config must parse.
      - name: Check fence tags
        run: python .github/scripts/check_fence_tags.py
