name: Update skill references

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest schema
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/metalbear-co/mirrord/main/mirrord-schema.json \
            -o /tmp/schema.json

      - name: Fetch latest configuration
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/metalbear-co/mirrord.dev/main/content/docs/reference/configuration.md \
            -o /tmp/configuration.md

      # The enterprise blocks GITHUB_TOKEN from creating pull requests, so
      # gh pr create authenticates as the Cubby app instead (same pattern as
      # auto-release-pr in mirrord/operator).
      - name: Create app token for PR creation
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for changes, update, and open PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          SCHEMA_CHANGED=false
          CONFIG_CHANGED=false

          if ! diff -q /tmp/schema.json skills/mirrord-config/references/schema.json >/dev/null 2>&1; then
            SCHEMA_CHANGED=true
          fi

          if ! diff -q /tmp/configuration.md skills/mirrord-config/references/configuration.md >/dev/null 2>&1; then
            CONFIG_CHANGED=true
          fi

          if [ "$SCHEMA_CHANGED" = false ] && [ "$CONFIG_CHANGED" = false ]; then
            echo "No changes detected, skipping."
            exit 0
          fi

          # Copy updated files
          cp /tmp/schema.json skills/mirrord-config/references/schema.json
          cp /tmp/configuration.md skills/mirrord-config/references/configuration.md

          # Bump the skill version past any version an open auto-update branch
          # already claims. See the script for why.
          NEW_VERSION=$(python3 .github/scripts/bump_skill_version.py mirrord-config auto/update-mirrord-config-refs-v)

          # Build description of what changed
          UPDATED=""
          if [ "$SCHEMA_CHANGED" = true ]; then UPDATED="schema"; fi
          if [ "$CONFIG_CHANGED" = true ]; then
            [ -n "$UPDATED" ] && UPDATED="$UPDATED + config" || UPDATED="config"
          fi

          # Create branch and commit
          BRANCH="auto/update-mirrord-config-refs-v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/mirrord-config/
          git commit -m "Update mirrord-config references ($UPDATED) → v${NEW_VERSION}

          Auto-updated from upstream sources:
          - schema: https://raw.githubusercontent.com/metalbear-co/mirrord/main/mirrord-schema.json
          - config: https://raw.githubusercontent.com/metalbear-co/mirrord.dev/main/content/docs/reference/configuration.md"
          git push -u origin "$BRANCH"

          # Open PR and assign reviewer
          gh pr create \
            --title "Update mirrord-config references → v${NEW_VERSION}" \
            --body "$(cat <<EOF
          ## Summary
          - Updated mirrord-config references ($UPDATED)
          - Bumped skill version to v${NEW_VERSION}

          ### Sources
          - schema: metalbear-co/mirrord \`mirrord-schema.json\`
          - config: metalbear-co/mirrord.dev \`content/docs/reference/configuration.md\`

          > Auto-generated by the weekly update-references workflow.
          EOF
          )"

  update-operator-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest operator chart values
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/metalbear-co/charts/main/mirrord-operator/values.yaml \
            -o /tmp/values.yaml

      # See the comment on the twin step in update-references above.
      - name: Create app token for PR creation
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for changes, update, and open PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if diff -q /tmp/values.yaml skills/mirrord-operator/references/values.yaml >/dev/null 2>&1; then
            echo "No changes detected, skipping."
            exit 0
          fi

          # Copy updated verbatim snapshot
          cp /tmp/values.yaml skills/mirrord-operator/references/values.yaml

          # Bump the skill version past any version an open auto-update branch
          # already claims. See the script for why.
          NEW_VERSION=$(python3 .github/scripts/bump_skill_version.py mirrord-operator auto/update-mirrord-operator-refs-v)

          # Create branch and commit
          BRANCH="auto/update-mirrord-operator-refs-v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/mirrord-operator/
          git commit -m "Update mirrord-operator references (values.yaml) → v${NEW_VERSION}

          Auto-updated from upstream source:
          - values: https://raw.githubusercontent.com/metalbear-co/charts/main/mirrord-operator/values.yaml"
          git push -u origin "$BRANCH"

          # Open PR and assign reviewer
          gh pr create \
            --title "Update mirrord-operator references → v${NEW_VERSION}" \
            --body "$(cat <<EOF
          ## Summary
          - Synced the verbatim chart \`references/values.yaml\`
          - Bumped skill version to v${NEW_VERSION}

          ### Review checklist
          - [ ] Check whether \`references/helm-values.md\` (curated digest) needs matching edits
          - [ ] Check whether \`SKILL.md\` needs updates for any new/removed feature flags or auth options

          ### Sources
          - values: metalbear-co/charts \`mirrord-operator/values.yaml\`

          > Auto-generated by the weekly update-references workflow.
          EOF
          )"

  update-mirrord-up-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest mirrord-up schema
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/metalbear-co/mirrord/main/mirrord-up-schema.json \
            -o /tmp/mirrord-up-schema.json

      # See the comment on the twin step in update-references above.
      - name: Create app token for PR creation
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check for changes, update, and open PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if diff -q /tmp/mirrord-up-schema.json skills/mirrord-up/references/schema.json >/dev/null 2>&1; then
            echo "No changes detected, skipping."
            exit 0
          fi

          # Copy updated verbatim snapshot
          cp /tmp/mirrord-up-schema.json skills/mirrord-up/references/schema.json

          # Bump the skill version past any version an open auto-update branch
          # already claims. See the script for why.
          NEW_VERSION=$(python3 .github/scripts/bump_skill_version.py mirrord-up auto/update-mirrord-up-refs-v)

          # Create branch and commit
          BRANCH="auto/update-mirrord-up-refs-v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/mirrord-up/
          git commit -m "Update mirrord-up references (schema) → v${NEW_VERSION}

          Auto-updated from upstream source:
          - schema: https://raw.githubusercontent.com/metalbear-co/mirrord/main/mirrord-up-schema.json"
          git push -u origin "$BRANCH"

          # Open PR and assign reviewer
          gh pr create \
            --title "Update mirrord-up references → v${NEW_VERSION}" \
            --body "$(cat <<EOF
          ## Summary
          - Synced the verbatim \`references/schema.json\`
          - Bumped skill version to v${NEW_VERSION}

          ### Sources
          - schema: metalbear-co/mirrord \`mirrord-up-schema.json\`

          > Auto-generated by the weekly update-references workflow.
          EOF
          )"
